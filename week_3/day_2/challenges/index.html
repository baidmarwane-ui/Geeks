```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge: Mad Libs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        label {
            display: inline-block;
            width: 140px;
            margin-bottom: 12px;
        }

        input {
            padding: 6px;
        }

        button {
            padding: 8px 14px;
            margin: 10px 5px 10px 0;
            cursor: pointer;
        }

        #story {
            font-weight: bold;
            color: darkblue;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>Mad Libs</h1>

    <form id="libform">
        <label for="noun">Noun:</label>
        <input type="text" id="noun" required>
        <br>

        <label for="adjective">Adjective:</label>
        <input type="text" id="adjective" required>
        <br>

        <label for="person">Someone's Name:</label>
        <input type="text" id="person" required>
        <br>

        <label for="verb">Verb:</label>
        <input type="text" id="verb" required>
        <br>

        <label for="place">A place:</label>
        <input type="text" id="place" required>
        <br>

        <button type="submit" id="lib-button">Lib it!</button>
        <button type="button" id="shuffle-button">Shuffle Story</button>
    </form>

    <h2>Generated story:</h2>
    <p id="story" aria-live="polite"></p>

    <script src="script.js"></script>

</body>
</html>
```
